# vip-template-version: 2
# Fires when an issue receives the 'vip-agent-ready' label.
# Routes to the AI agent configured in the AGENT_PROVIDER repository variable.
#
# Supported providers:
#   claude        → Claude Code via anthropics/claude-code-action (default, fully supported)
#   openai-codex  → OpenAI Codex via openai/codex-action, edit-only; vip-agent-publish.yml publishes
#   gemini        → Gemini CLI via google-github-actions/run-gemini-cli, file tools only; same publish
#   copilot       → GitHub Copilot via gh-aw (stub — extend for your setup)
#   custom        → repository_dispatch event (bring your own listener)
#
# Setup:
#   1. Set AGENT_PROVIDER in Settings → Secrets and variables → Variables
#   2. Add the required secret for your chosen provider (claude: CLAUDE_CODE_OAUTH_TOKEN,
#      openai-codex: OPENAI_API_KEY, gemini: GEMINI_API_KEY)
#   3. Run the VIP Setup Labels workflow once to create all labels
#
# If AGENT_PROVIDER is not set, the workflow defaults to claude.

name: VIP Agent-Ready Auto-Trigger

on:
  issues:
    # `labeled` only, on purpose.
    #
    # `edited` hands the issue author a re-run button: anyone whose issue once
    # earned a vip-agent-ready label could rewrite the body with new instructions
    # and re-fire the agent under a write-scoped token. A stale label must not
    # authorize a run on text it never covered.
    #
    # `opened` is worse — an issue author fires it without write access at all.
    #
    # Both were added to make the auto-labeler work. It cannot: a label applied
    # with GITHUB_TOKEN does not start a run. The fix for that is a human
    # applying the label, which `labeled` already covers.
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # The prompt tail every agent gets, whichever provider runs. Security-critical
  # rules belong here, never in AGENTS.md: a repository's own AGENTS.md replaces
  # ours, and must not be able to remove them.
  VIP_PROMPT_CORE: |
    WRITING GITHUB ACTIONS WORKFLOW FILES:

    Write every run: as a block scalar (run: |) by default. In a plain
    run: line, a colon followed by a space is parsed as a mapping and the
    whole file stops being valid YAML. Quoting does not save you — the
    outer scalar is still plain:

        run: echo $(( x > 0 ? 1 : 0 ))     # breaks
        run: git commit -m "fix: thing"    # breaks too

        run: |                             # fine
          git commit -m "fix: thing"

    GitHub cannot schedule a job from a file it could not read, so the
    run ends in seconds with no jobs and no log. That reads as broken
    code rather than broken YAML.

    If this repository depends on code you cannot read from here — a private
    dependency, an API you cannot reach — do NOT guess its contract. Do what you
    can, and state the unverified assumption plainly where a reviewer will read
    it: in the plan when planning, in the PR body when implementing. A confident
    change built on a guessed interface passes review and fails in production.
  # Claude opens its own pull request; the other providers hand their changes to
  # vip-agent-publish.yml, which validates them instead.
  VIP_PROMPT_CLAUDE_PUBLISH: |
    Before opening the PR, if you added or changed anything under
    .github/workflows/, run:

        bash scripts/vip-validate-workflows.sh

    Fix what it reports and run it again. Do not open the PR while it
    is failing.

# One run per issue. Observed on 21 August: three runs started concurrently on a
# single issue when its labels arrived close together, and the existing-PR check
# stopped none of them — at that moment none had opened a PR yet, so each saw a
# clear field. That check guards against duplicate pull requests; this guards
# against duplicate runs, and they are different problems.
#
# cancel-in-progress is false on purpose. An agent run that is partway through
# writing files and is then cancelled leaves nothing behind and reports nothing
# useful; queuing costs a few minutes and keeps whatever the first run produced.
concurrency:
  group: agent-ready-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # PREFLIGHT (every implemented provider)
  # Who applied the label, the issue's labels, its structure, and whether an agent
  # PR is already open. Runs as its own job so the agent jobs that follow hold
  # only the scope they need, and so no local action runs after an agent step.
  # See .github/actions/vip-agent-preflight/action.yml.
  # ─────────────────────────────────────────────────────────────────────────────
  preflight:
    if: |
      github.event.label.name == 'vip-agent-ready' &&
      contains(fromJSON('["", "claude", "openai-codex", "gemini"]'), vars.AGENT_PROVIDER)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      proceed: ${{ steps.preflight.outputs.proceed }}
      is_high: ${{ steps.preflight.outputs.is_high }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight
        id: preflight
        uses: ./.github/actions/vip-agent-preflight

  # ─────────────────────────────────────────────────────────────────────────────
  # CLAUDE (default)
  # Complexity-aware execution.
  #
  # vip-complexity:high  → plan first, human approves by commenting /approve-plan,
  #                    then vip-plan-approval-gate.yml implements it
  # vip-complexity:low/medium (or absent) → implement directly
  #
  # The prompts below spell out the work rather than invoking the
  # compound-engineering plugin's /ce-plan and /ce-work, which are local-only and
  # not available on a GitHub runner.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-claude:
    # The event's own label must be vip-agent-ready (gated in preflight). Without
    # that, adding any other label to an already-agent-ready issue starts a run —
    # observed live when a complexity label and vip-agent-ready arrived seconds
    # apart and produced two runs on one issue.
    needs: preflight
    if: |
      needs.preflight.outputs.proceed == 'true' &&
      (vars.AGENT_PROVIDER == 'claude' || vars.AGENT_PROVIDER == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── HIGH COMPLEXITY: plan first, then gate on /approve-plan ──────────────
      - name: Run Claude Code — Planning Phase (vip-complexity:high)
        id: claude-plan
        if: needs.preflight.outputs.is_high == 'true'
        uses: ./.github/actions/vip-claude-run
        with:
          mode: plan
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          debug: ${{ vars.AGENT_DEBUG }}
          report_issue_number: ${{ github.event.issue.number }}
          github_token: ${{ github.token }}
          prompt: |
            You are planning the implementation for issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            This is a vip-complexity:high issue. Your job is to PLAN, not implement.

            Instructions:
            1. Read the full issue body:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md, and CLAUDE.md if it exists, for project-specific guidance
            3. Read the key files referenced in Technical Notes to understand the codebase
            4. Write a structured implementation plan as a markdown file saved to:
               docs/plans/YYYY-MM-DD-NNN-<type>-<short-title>-plan.md
               The plan should include: problem frame, requirements, scope boundaries,
               key technical decisions, and implementation units (each with goal, files,
               approach, and test scenarios)
            5. Commit the plan file to a new branch named:
               plan/issue-${{ github.event.issue.number }}
            6. After committing, post a comment on the issue with:
               - A link to the plan file (GitHub URL)
               - "Implementation plan is ready for review. Reply /approve-plan to begin
                 implementation."
               - "To change the plan first: edit the file on the plan branch, or add
                 your feedback to this issue and re-apply the vip-agent-ready label to
                 replan. Commenting alone does not trigger anything — only
                 /approve-plan is listened for."
            7. Do NOT write any application code
            8. Do NOT open a pull request

            ${{ env.VIP_PROMPT_CORE }}
      - name: Run Claude Code — Direct Execution (vip-complexity:low/medium)
        id: claude-work
        if: needs.preflight.outputs.is_high != 'true'
        uses: ./.github/actions/vip-claude-run
        with:
          mode: implement
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          debug: ${{ vars.AGENT_DEBUG }}
          report_issue_number: ${{ github.event.issue.number }}
          github_token: ${{ github.token }}
          prompt: |
            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            Instructions:
            1. Read the full issue body carefully using the GitHub CLI:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md, and CLAUDE.md if it exists, for project-specific guidance
            3. Implement the feature following the acceptance criteria exactly
            4. Stay within the defined scope — "Out of scope" is a hard boundary
            5. Follow the patterns referenced in Technical Notes (read the key files listed there)
            6. Create a branch, commit your changes, and open a PR:
               - Branch name: agent/issue-${{ github.event.issue.number }}
               - PR title should match the issue title
               - PR body: reference "Closes #${{ github.event.issue.number }}" and summarize what you did
               - Use the template at .github/PULL_REQUEST_TEMPLATE/vip-agent-generated.md if it exists
            7. Add the 'vip-agent-generated' label to the PR
            8. After the PR is open, update the original issue's acceptance criteria:
               - Check off any criteria your implementation directly satisfies
               - Leave unchecked anything that requires manual testing, human review, or CI
               - Use gh issue edit to update the checkbox state in the issue body

            If you are blocked or unclear on something, post a comment on the issue
            asking for clarification rather than guessing.

            ${{ env.VIP_PROMPT_CORE }}

            ${{ env.VIP_PROMPT_CLAUDE_PUBLISH }}
      - name: Report agent failure
        if: failure() || cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const MARKER = '<!-- agentic-workflow:failure-report -->';
            const lines = [
                '⚠️ **The agent run failed**',
                '',
                `The failing step and its error are in the [job log](${runUrl}) — start there.`,
                '',
                'Check the Claude provider setup:',
                '',
                '- **Required:** the `CLAUDE_CODE_OAUTH_TOKEN` secret — **Settings → Secrets and variables → Actions → Secrets**. If you use Claude Code in a terminal, `/install-github-app` adds it.',
                '- **Recommended:** the **Claude GitHub App** installed on this repository — https://github.com/apps/claude. Without it the agent still runs, but its pull requests get no CI runs.',
                '',
                'If the log shows `App token exchange failed: 401 Unauthorized` within a few seconds of the run starting, install the app.'
            ];
            // Everything the reader needs is inline. This used to end with a
            // relative link to the template README, but neither setup.sh nor
            // Codebase Manager installs that README, so in a customer repo the
            // link opened the customer's own.

            // Update in place. This comment used to stack: observed posting
            // twice for one issue, and staying the newest word on the issue
            // long after the cause was fixed and a later run had succeeded.
            const body = [MARKER, ...lines].join('\n');
            const { data: existing } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 100,
            });
            const mine = existing.find(c => c.body && c.body.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.issue.number, body,
              });
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # OPENAI CODEX
  # Codex edits files only. Its sandbox keeps .git read-only and the network off,
  # so it cannot commit or push; vip-agent-publish.yml validates what it changed
  # and publishes it. From the agent step on, this job is treated as
  # compromised: no secret after it, no local action, no git, and the snapshot
  # step runs in an empty environment.
  # ─────────────────────────────────────────────────────────────────────────────
  codex-agent:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true' && vars.AGENT_PROVIDER == 'openai-codex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          persist-credentials: false

      # Files that would steer the agent or its tools from inside the repository:
      # env files the CLI may load, and per-repo agent settings.
      - name: Remove repository agent settings and env files
        run: |
          find . -path ./.git -prune -o \( -name '.env*' -o -name .codex -o -name .agents -o -name .gemini \) -prune -print0 \
            | xargs -0 -r rm -rf --

      - name: Prepare the Codex run
        id: setup
        uses: ./.github/actions/vip-codex-run
        with:
          mode: ${{ needs.preflight.outputs.is_high == 'true' && 'plan' || 'implement' }}
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          issue_body: ${{ github.event.issue.body }}
          tail: ${{ env.VIP_PROMPT_CORE }}

      - name: Codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          codex-home: ${{ steps.setup.outputs.codex_home }}
          prompt-file: ${{ steps.setup.outputs.prompt_file }}
          output-file: ${{ steps.setup.outputs.final_message_file }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo

      - name: Snapshot the workspace
        shell: /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          out='${{ runner.temp }}/vip-agent-out'
          mkdir -p "$out"
          tar --anchored --exclude=./.git -C '${{ github.workspace }}' -czf "$out/snapshot.tgz" .
          rm -rf '${{ github.workspace }}/.git'

      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vip-agent-snapshot
          path: ${{ runner.temp }}/vip-agent-out
          retention-days: 1
          # The snapshot is already gzipped.
          compression-level: 0

  codex-publish:
    needs: [preflight, codex-agent]
    if: always() && needs.preflight.outputs.proceed == 'true' && vars.AGENT_PROVIDER == 'openai-codex'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    uses: ./.github/workflows/vip-agent-publish.yml
    with:
      mode: ${{ needs.preflight.outputs.is_high == 'true' && 'plan' || 'implement' }}
      provider: openai-codex
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      agent_result: ${{ needs.codex-agent.result }}
      agent_job: codex-agent
    # Explicit, never `inherit`: inheriting would hand the model keys to a job
    # that has no use for them. Unset, the publish job uses GITHUB_TOKEN.
    secrets:
      publish_token: ${{ secrets.VIP_AGENT_PUBLISH_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # GEMINI
  # Gemini edits files with file tools only: no shell, no web. A separate job
  # scans its output for its API key, and vip-agent-publish.yml validates and
  # publishes what it changed. From the agent step on, this job is treated as
  # compromised, as for Codex.
  # ─────────────────────────────────────────────────────────────────────────────
  gemini-agent:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true' && vars.AGENT_PROVIDER == 'gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          persist-credentials: false

      # Files that would steer the agent or its tools from inside the repository.
      # Gemini trusts the workspace (the action requires it), so a repository
      # .gemini/settings.json or .env would otherwise be honoured.
      - name: Remove repository agent settings and env files
        run: |
          find . -path ./.git -prune -o \( -name '.env*' -o -name .codex -o -name .agents -o -name .gemini \) -prune -print0 \
            | xargs -0 -r rm -rf --

      - name: Prepare the Gemini run
        id: setup
        uses: ./.github/actions/vip-gemini-run
        with:
          mode: ${{ needs.preflight.outputs.is_high == 'true' && 'plan' || 'implement' }}
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          issue_body: ${{ github.event.issue.body }}
          tail: ${{ env.VIP_PROMPT_CORE }}

      - name: Gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: '0.65.0'
          settings: ${{ steps.setup.outputs.settings }}
          prompt: ${{ steps.setup.outputs.prompt }}

      # Untrusted from here on: an empty environment, no secrets, no git.
      - name: Snapshot the workspace
        shell: /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          w='${{ github.workspace }}'
          out='${{ runner.temp }}/vip-agent-out'
          mkdir -p "$out"
          log="$w/gemini-artifacts/stdout.log"
          if [[ -s "$log" ]]; then
            jq -r '.response // ""' "$log" > "$out/final-message.md" 2>/dev/null || true
            jq '{turns: ([.stats.models[]?.roles.main.totalRequests // 0] | add // 0),
                 tokens: ([.stats.models[]?.tokens.total // 0] | add // 0),
                 tool_failures: (.stats.tools.totalFail // 0)}' "$log" > "$out/metrics.json" 2>/dev/null || true
          fi
          tar --anchored --exclude=./.git --exclude=./gemini-artifacts -C "$w" -czf "$out/snapshot.tgz" .
          rm -rf "$w/.git"

      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vip-agent-snapshot
          path: ${{ runner.temp }}/vip-agent-out
          retention-days: 1
          # The snapshot is already gzipped.
          compression-level: 0

  # Gemini's key is in its own environment, so the snapshot and its final
  # message are checked for the key's literal value on a fresh runner before
  # anything is published. The only job besides the agent that holds the key.
  gemini-keyscan:
    needs: [preflight, gemini-agent]
    if: needs.gemini-agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.scan.outputs.result }}
    steps:
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vip-agent-snapshot
          path: ${{ runner.temp }}/scan

      - name: Look for the key
        id: scan
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
          DIR: ${{ runner.temp }}/scan
        run: |
          result=fail
          if [[ -n "$KEY" ]]; then
            hits="$( { zcat "$DIR/snapshot.tgz"; find "$DIR" -type f ! -name snapshot.tgz -exec cat {} +; } | grep -acF -- "$KEY" || true)"
            [[ "$hits" == "0" ]] && result=pass
          fi
          echo "Key scan: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

  gemini-publish:
    needs: [preflight, gemini-agent, gemini-keyscan]
    if: always() && needs.preflight.outputs.proceed == 'true' && vars.AGENT_PROVIDER == 'gemini'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    uses: ./.github/workflows/vip-agent-publish.yml
    with:
      mode: ${{ needs.preflight.outputs.is_high == 'true' && 'plan' || 'implement' }}
      provider: gemini
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      agent_result: ${{ needs.gemini-agent.result }}
      agent_job: gemini-agent
      key_scan_result: ${{ needs.gemini-keyscan.outputs.result || needs.gemini-keyscan.result }}
    secrets:
      publish_token: ${{ secrets.VIP_AGENT_PUBLISH_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # GITHUB COPILOT via gh-aw (stub)
  # TODO: extend this job for your gh-aw setup.
  # See https://github.com/github/gh-aw for the CLI reference.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-copilot:
    if: |
      github.event.label.name == 'vip-agent-ready' &&
      vars.AGENT_PROVIDER == 'copilot'
    runs-on: ubuntu-latest
    # Only what a stub needs. Raise contents/pull-requests to write when you
    # implement the job below.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Copilot via gh-aw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # TODO: Replace this stub with your gh-aw invocation.
          # Prerequisites:
          #   1. Install gh-aw: gh extension install github/gh-aw
          #   2. Author a workflow markdown file (e.g., .github/workflows/implement-issue.md)
          #   3. Compile it: gh aw compile implement-issue
          #
          # Then invoke the compiled workflow:
          #   gh aw run implement-issue --issue "${ISSUE_NUMBER}"
          #
          echo "GitHub Copilot (gh-aw) provider stub — configure this step for your setup"
          echo "Issue #${ISSUE_NUMBER}"

      - name: Report that this provider is not implemented
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '### No pull request will be opened',
                '',
                '`AGENT_PROVIDER` is set to `copilot`, which is not implemented in this',
                'template. The `trigger-copilot` job is a stub: it does not run an agent.',
                '',
                'Two ways forward:',
                '',
                '- Implement `trigger-copilot` in `.github/workflows/vip-agent-ready-trigger.yml`.',
                '- Or set `AGENT_PROVIDER` to `claude`, the one provider implemented today.',
                '',
                'This run is marked failed on purpose. A run that produces nothing should not',
                'report success \u2014 that is how a repository looks configured while the agent',
                'silently never fires.'
              ].join('\n')
            });
            core.setFailed('AGENT_PROVIDER=copilot is a stub; no agent ran and no PR was opened.');

  # ─────────────────────────────────────────────────────────────────────────────
  # CUSTOM — repository_dispatch
  # Emits an event that a listener workflow in this repo can consume.
  # Note: repository_dispatch events are NOT cross-repo. Your listener workflow
  # must be in this same repository. For outbound HTTP to an external agent,
  # replace the github-script step with a curl call.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-custom:
    if: |
      github.event.label.name == 'vip-agent-ready' &&
      vars.AGENT_PROVIDER == 'custom'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Dispatch vip-agent-ready event
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'vip-agent-ready',
              client_payload: {
                issue_number: context.payload.issue.number,
                issue_title: context.payload.issue.title,
                issue_body: context.payload.issue.body,
                issue_url: context.payload.issue.html_url,
                labels: context.payload.issue.labels.map(l => l.name)
              }
            });
            console.log(`Dispatched vip-agent-ready event for issue #${context.payload.issue.number}`);

      # A dispatch with no listener is indistinguishable from a working setup:
      # the job goes green and the issue stays silent. Say what happened, so the
      # absence of a follow-up reads as "my listener did not run" rather than
      # "the agent ignored me".
      - name: Say that the event was dispatched
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'Dispatched a `repository_dispatch` event of type `vip-agent-ready` for this issue.',
                '',
                'This template does not implement the agent for `AGENT_PROVIDER=custom` \u2014 it',
                'hands off. If nothing happens next, the listener workflow in this repository',
                'is missing or did not match; `repository_dispatch` is not cross-repo, so the',
                'listener has to live here.'
              ].join('\n')
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # UNKNOWN PROVIDER
  # A typo in AGENT_PROVIDER used to match no job at all: the run went green with
  # nothing in it, and the issue never heard back. Say so, and fail.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-unknown-provider:
    if: |
      github.event.label.name == 'vip-agent-ready' &&
      !contains(fromJSON('["", "claude", "openai-codex", "gemini", "copilot", "custom"]'), vars.AGENT_PROVIDER)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Report the unrecognised provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROVIDER: ${{ vars.AGENT_PROVIDER }}
        with:
          script: |
            const provider = process.env.PROVIDER;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '### No agent was started',
                '',
                '`AGENT_PROVIDER` is set to a value this template does not recognise:',
                '',
                '```',
                provider,
                '```',
                '',
                'Valid values: `claude` (the default when unset), `openai-codex`, `gemini`, `copilot`, `custom`.',
                'Change it in **Settings → Secrets and variables → Actions → Variables**, then',
                'remove and re-apply `vip-agent-ready`.'
              ].join('\n')
            });
            core.setFailed(`AGENT_PROVIDER=${provider} is not a recognised provider.`);
